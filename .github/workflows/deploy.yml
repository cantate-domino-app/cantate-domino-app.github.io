name: Deploy su GitHub Pages

on:
  push:
    branches: ['main']
  # Ripubblica il catalogo per le modifiche fatte a mano nel foglio. GitHub non rispetta l'orario:
  # tra un giro e l'altro passano spesso alcune ore. I canti accettati dal pannello partono subito.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa dipendenze
        run: npm ci

      - name: Scarica il catalogo dei canti
        run: node scripts/scarica-catalogo.mjs
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Build con Vite
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Carica artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4